{% extends "base.html" %}
{% block title %}Новый пост — Rebu{% endblock %}

{% block content %}
<div class="feed-wrap">
<div class="page-hdr">
  <h1>Создать пост</h1>
  <p>Используйте кнопку <i class="fas fa-image" style="color:var(--accent)"></i> в редакторе для вставки изображений</p>
</div>

<div class="card">
  <form method="POST" id="postForm">
    <div class="form-group">
      <label class="form-label">Сообщество</label>
      <select name="community_id" class="form-select" id="communitySelect">
        <option value="">— Общая лента —</option>
        {% for community in communities %}
        <option value="{{ community.id }}"
          {% if preselect_community and community.id|string == preselect_community|string %}selected{% endif %}>
          r/{{ community.name }} — {{ community.display_name }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label class="form-label" for="postTitle">
        Заголовок <span class="req">*</span>
      </label>
      <input type="text" name="title" id="postTitle" class="form-input"
             placeholder="Введите заголовок поста" required maxlength="300" autocomplete="off">
      <div class="form-hint"><span id="titleCount">0</span> / 300</div>
    </div>

    <div class="form-group">
      <label class="form-label">Содержание <span class="req">*</span></label>
      <div id="editorWrap">
        <textarea id="postContent" name="content"></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-paper-plane"></i> Опубликовать
      </button>
      <button type="button" class="btn btn-ghost" onclick="clearForm()">
        <i class="fas fa-xmark"></i> Очистить
      </button>
      <a href="{{ url_for('index') }}" class="btn btn-ghost">Отмена</a>
    </div>
  </form>
</div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.tiny.cloud/1/t4sz6siquna8c2qwiiui5f0pru19ajpggk7u0xkvp5n5odrd/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script>
<script>
tinymce.init({
  selector: '#postContent',
  language: 'ru',
  height: 380,
  min_height: 260,
  menubar: false,
  branding: false,
  resize: 'vertical',
  plugins: 'lists link image table code fullscreen autolink',
  toolbar: 'bold italic underline strikethrough | blocks | bullist numlist | blockquote link image table | code fullscreen',
  toolbar_mode: 'sliding',
  content_style:
    'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;' +
    'font-size:15px;line-height:1.65;color:#1a1916;padding:10px 14px;margin:0}' +
    'p{margin:0 0 .75em}' +
    'img{max-width:100%;height:auto;border-radius:8px;display:block;margin:.5em 0}' +
    'blockquote{border-left:3px solid #e8402a;padding:6px 14px;margin:1em 0;background:#f0eeea;border-radius:0 5px 5px 0}' +
    'pre{background:#1e1e1e;color:#d4d4d4;padding:14px;border-radius:6px;overflow-x:auto}' +
    'code{background:#f0eeea;padding:2px 5px;border-radius:3px;font-size:13px}',

  // Image upload handler — sends to /upload_image, returns {location: url}
  images_upload_url: '{{ url_for("upload_image") }}',
  images_reuse_filename: false,
  images_upload_credentials: true,   // send session cookies
  images_upload_handler: function(blobInfo, progress) {
    return new Promise(function(resolve, reject) {
      var fd = new FormData();
      fd.append('file', blobInfo.blob(), blobInfo.filename());

      var xhr = new XMLHttpRequest();
      xhr.withCredentials = true;   // send session cookie
      xhr.open('POST', '{{ url_for("upload_image") }}');

      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) progress(e.loaded / e.total * 100);
      };

      xhr.onload = function() {
        if (xhr.status === 401) {
          reject({ message: 'Сессия истекла — войдите заново', remove: true });
          return;
        }
        if (xhr.status < 200 || xhr.status >= 300) {
          reject('Ошибка загрузки: HTTP ' + xhr.status);
          return;
        }
        try {
          var json = JSON.parse(xhr.responseText);
          if (!json.location) { reject('Сервер не вернул URL'); return; }
          resolve(json.location);
        } catch(e) {
          reject('Неверный ответ сервера');
        }
      };

      xhr.onerror = function() { reject('Сетевая ошибка при загрузке'); };
      xhr.send(fd);
    });
  },

  setup: function(editor) {
    editor.on('input change keyup', debounce(saveDraft, 800));
    editor.on('init', loadDraft);
  }
});

function debounce(fn, ms) {
  var t; return function() { clearTimeout(t); t = setTimeout(fn, ms); };
}

// ── Draft ─────────────────────────────────────────────────────────────────────
function saveDraft() {
  try {
    var ed = tinymce.get('postContent');
    localStorage.setItem('rebu_post_draft', JSON.stringify({
      title:     document.getElementById('postTitle').value,
      content:   ed ? ed.getContent() : '',
      community: document.getElementById('communitySelect').value,
      ts:        Date.now()
    }));
  } catch(e) {}
}

function loadDraft() {
  try {
    var raw = localStorage.getItem('rebu_post_draft');
    if (!raw) return;
    var d = JSON.parse(raw);
    if (Date.now() - d.ts > 86400000) { localStorage.removeItem('rebu_post_draft'); return; }
    if (!(d.title || d.content)) return;
    if (!confirm('Восстановить черновик от ' + new Date(d.ts).toLocaleString('ru') + '?')) {
      localStorage.removeItem('rebu_post_draft'); return;
    }
    document.getElementById('postTitle').value = d.title || '';
    if (d.community) document.getElementById('communitySelect').value = d.community;
    var ed = tinymce.get('postContent');
    if (ed) ed.setContent(d.content || '');
  } catch(e) {}
}

function clearForm() {
  if (!confirm('Очистить форму?')) return;
  document.getElementById('postTitle').value = '';
  document.getElementById('communitySelect').value = '';
  var ed = tinymce.get('postContent');
  if (ed) ed.setContent('');
  localStorage.removeItem('rebu_post_draft');
  document.getElementById('titleCount').textContent = '0';
}

// ── Title counter ─────────────────────────────────────────────────────────────
document.getElementById('postTitle').addEventListener('input', function() {
  document.getElementById('titleCount').textContent = this.value.length;
  saveDraft();
});

// ── Submit ────────────────────────────────────────────────────────────────────
document.getElementById('postForm').addEventListener('submit', function(e) {
  var title = document.getElementById('postTitle').value.trim();
  var ed    = tinymce.get('postContent');

  // Sync editor content to textarea BEFORE submit
  if (ed) ed.save();

  var content = ed ? ed.getContent().replace(/<[^>]*>/g, '').trim() : '';
  if (!title) { e.preventDefault(); alert('Введите заголовок'); return; }
  if (!content) { e.preventDefault(); alert('Введите содержание поста'); return; }

  localStorage.removeItem('rebu_post_draft');
});
</script>
{% endblock %}
