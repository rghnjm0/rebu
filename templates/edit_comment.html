<!-- templates/edit_comment.html -->
{% extends "base.html" %}

{% block title %}Редактировать комментарий{% endblock %}

{% block content %}
<div class="edit-comment-container">
    <div class="edit-comment-header">
        <h1>Редактировать комментарий</h1>
        <p class="subtitle">Измените текст комментария</p>
    </div>

    <div class="edit-comment-card">
        <form method="POST" action="{{ url_for('edit_comment', comment_id=comment.id) }}">
            <div class="form-group">
                <label for="content">
                    <i class="fas fa-comment"></i>
                    Текст комментария:
                </label>
                <textarea id="content" name="content" rows="6"
                          class="form-control" required placeholder="Ваш комментарий...">{{ comment.content }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Сохранить
                </button>
                <a href="{{ url_for('post_detail', post_id=comment.post_id) }}" class="btn btn-outline">
                    <i class="fas fa-times"></i> Отмена
                </a>
            </div>
        </form>
    </div>
</div>

<style>
.edit-comment-container {
    max-width: 800px;
    margin: 0 auto;
}

.edit-comment-header {
    text-align: center;
    margin-bottom: 24px;
}

.edit-comment-header h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--primary-color);
    margin-bottom: 8px;
}

.edit-comment-header .subtitle {
    color: var(--text-secondary);
    font-size: 16px;
}

.edit-comment-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 30px;
    border: 1px solid var(--border-light);
    box-shadow: var(--shadow-sm);
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: var(--text-secondary);
    font-size: 14px;
}

.form-group label i {
    margin-right: 6px;
    color: var(--primary-color);
}

.form-control {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: var(--bg-main);
    color: var(--text-primary);
    transition: var(--transition);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    line-height: 1.6;
    resize: vertical;
}

.form-control:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(183, 41, 41, 0.1);
}

.form-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border-light);
}

.form-actions .btn {
    flex: 1;
    justify-content: center;
    padding: 12px;
}

@media (max-width: 768px) {
    .edit-comment-card {
        padding: 20px;
    }

    .form-actions {
        flex-direction: column;
    }
}
</style>

<script>
document.getElementById('content').focus();
</script>
{% endblock %}
