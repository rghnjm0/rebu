{% extends "base.html" %}
{% block title %}Редактировать: {{ post.title }} — Rebu{% endblock %}

{% block content %}
<div class="feed-wrap">
<div class="page-hdr">
  <h1>Редактировать пост</h1>
</div>

<div class="card">
  <form method="POST" id="editForm">
    <div class="form-group">
      <label class="form-label" for="editTitle">
        Заголовок <span class="req">*</span>
      </label>
      <input type="text" name="title" id="editTitle" class="form-input"
             value="{{ post.title }}" required maxlength="300" autocomplete="off">
      <div class="form-hint"><span id="titleCount">{{ post.title | length }}</span> / 300</div>
    </div>

    <div class="form-group">
      <label class="form-label">Содержание <span class="req">*</span></label>
      <textarea id="editContent" name="content">{{ post.content | safe }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-floppy-disk"></i> Сохранить изменения
      </button>
      <a href="{{ url_for('post_detail', post_id=post.id) }}" class="btn btn-ghost">Отмена</a>
    </div>
  </form>
</div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.tiny.cloud/1/t4sz6siquna8c2qwiiui5f0pru19ajpggk7u0xkvp5n5odrd/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script>
<script>
tinymce.init({
  selector: '#editContent',
  language: 'ru',
  height: 380,
  min_height: 260,
  menubar: false,
  branding: false,
  resize: 'vertical',
  plugins: 'lists link image table code fullscreen autolink',
  toolbar: 'bold italic underline strikethrough | blocks | bullist numlist | blockquote link image table | code fullscreen',
  toolbar_mode: 'sliding',
  content_style:
    'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;' +
    'font-size:15px;line-height:1.65;color:#1a1916;padding:10px 14px;margin:0}' +
    'p{margin:0 0 .75em}' +
    'img{max-width:100%;height:auto;border-radius:8px;display:block;margin:.5em 0}' +
    'blockquote{border-left:3px solid #e8402a;padding:6px 14px;margin:1em 0;background:#f0eeea;border-radius:0 5px 5px 0}' +
    'pre{background:#1e1e1e;color:#d4d4d4;padding:14px;border-radius:6px;overflow-x:auto}' +
    'code{background:#f0eeea;padding:2px 5px;border-radius:3px;font-size:13px}',

  images_upload_url: '{{ url_for("upload_image") }}',
  images_reuse_filename: false,
  images_upload_credentials: true,
  images_upload_handler: function(blobInfo, progress) {
    return new Promise(function(resolve, reject) {
      var fd = new FormData();
      fd.append('file', blobInfo.blob(), blobInfo.filename());

      var xhr = new XMLHttpRequest();
      xhr.withCredentials = true;
      xhr.open('POST', '{{ url_for("upload_image") }}');

      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) progress(e.loaded / e.total * 100);
      };

      xhr.onload = function() {
        if (xhr.status === 401) {
          reject({ message: 'Сессия истекла — войдите заново', remove: true });
          return;
        }
        if (xhr.status < 200 || xhr.status >= 300) {
          reject('Ошибка загрузки: HTTP ' + xhr.status);
          return;
        }
        try {
          var json = JSON.parse(xhr.responseText);
          if (!json.location) { reject('Сервер не вернул URL'); return; }
          resolve(json.location);
        } catch(e) {
          reject('Неверный ответ сервера');
        }
      };

      xhr.onerror = function() { reject('Сетевая ошибка при загрузке'); };
      xhr.send(fd);
    });
  }
});

document.getElementById('editTitle').addEventListener('input', function() {
  document.getElementById('titleCount').textContent = this.value.length;
});

document.getElementById('editForm').addEventListener('submit', function(e) {
  var ed = tinymce.get('editContent');
  if (ed) ed.save();   // sync to textarea

  var title   = document.getElementById('editTitle').value.trim();
  var content = ed ? ed.getContent().replace(/<[^>]*>/g, '').trim() : '';
  if (!title)   { e.preventDefault(); alert('Введите заголовок'); return; }
  if (!content) { e.preventDefault(); alert('Содержание не может быть пустым'); return; }
});
</script>
{% endblock %}
